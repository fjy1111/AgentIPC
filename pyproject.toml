[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentipc"
version = "0.1.0"
description = "Low-overhead communication, shared state, and persistent memory runtime for multi-agent collaboration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "numpy>=1.24",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
agentipc = "agentipc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]